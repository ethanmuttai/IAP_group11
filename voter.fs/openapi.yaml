openapi: 3.0.0

info:
  title: Voter Edu API
  version: 1.0.0
  description: >
    API exposed by Voter Edu to downstream partners for accessing candidate
    information, policy positions, and candidate reviews. The API supports
    reading candidate information, creating reviews, and replacing existing
    reviews.

    Versioning: every path is also available under /api/v1 and /api/v2.
    v1 (and the unversioned /api paths) returns lists as a bare JSON array and
    is deprecated, with a Sunset date of 13 Nov 2026. v2 returns lists as
    { data: [...], count: N }. Single objects and error bodies are identical
    in both versions. Deprecated responses carry Deprecation, Sunset and Link
    (rel=successor-version) headers.

servers:
  - url: http://localhost:5000/api
    description: Local development server (v1, deprecated list shape)
  - url: http://localhost:5000/api/v2
    description: Local development server, v2 (lists wrapped as { data, count })

paths:
  /candidates:
    get:
      summary: Return the list of candidates with their profiles and policy positions
      responses:
        '200':
          description: A list of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
              example:
                - id: "ruto"
                  initials: "WR"
                  name: "Dr. William Ruto"
                  party: "Kenya Kwanza Alliance / UDA"
                  description: "Current President of Kenya with experience in national government."
                  experience: "Current President of Kenya (2022-2026), former Deputy President (2013-2022)."
                  vision: "The Bottom-Up Economic Transformation Agenda (BETA)."
                  fiscal: "Expanding the formal tax base to manage public debt."
                  agriculture: "Subsidized farm inputs and fertilizer distribution."
                  governance: "Protecting and increasing funding to the 47 counties."
                  cost_of_living: "Cutting consumer levies and production taxes."
                  average_rating: 4.0
                  review_count: 1

  /candidates/{candidateId}:
    get:
      summary: Return the full profile of a single candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          description: Unique identifier of the candidate
          schema:
            type: string
            example: "ruto"
      responses:
        '200':
          description: The requested candidate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
              example:
                id: "ruto"
                initials: "WR"
                name: "Dr. William Ruto"
                party: "Kenya Kwanza Alliance / UDA"
                description: "Current President of Kenya with experience in national government."
                experience: "Current President of Kenya (2022-2026), former Deputy President (2013-2022)."
                vision: "The Bottom-Up Economic Transformation Agenda (BETA)."
                fiscal: "Expanding the formal tax base to manage public debt."
                agriculture: "Subsidized farm inputs and fertilizer distribution."
                governance: "Protecting and increasing funding to the 47 counties."
                cost_of_living: "Cutting consumer levies and production taxes."
                average_rating: 4.0
                review_count: 1

        '404':
          description: No candidate exists with the given candidate ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Candidate not found"

  /candidates/{candidateId}/reviews:
    get:
      summary: Return all reviews for a candidate, optionally filtered by minimum rating
      parameters:
        - name: candidateId
          in: path
          required: true
          description: Unique identifier of the candidate
          schema:
            type: string
            example: "ruto"

        - name: minRating
          in: query
          required: false
          description: Return only reviews with a rating greater than or equal to this value
          schema:
            type: integer
            minimum: 1
            maximum: 5
            example: 4

      responses:
        '200':
          description: A list of reviews for the candidate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 1
                  candidate_id: "ruto"
                  user: "Anonymous Voter"
                  rating: 4
                  text: "Clear focus on devolution structural systems, but need more clarity on agricultural subsidy time-tables."
                  date: "2026-06-25"

        '400':
          description: Invalid minimum rating supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_PARAMETER"
                message: "minRating must be an integer between 1 and 5"

        '404':
          description: No candidate exists with the given candidate ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Candidate not found"

    post:
      summary: Add a new review for a candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          description: Unique identifier of the candidate being reviewed
          schema:
            type: string
            example: "ruto"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            example:
              user: "Verified User"
              rating: 5
              text: "The candidate has clearly communicated their policy priorities."

      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id: 2
                candidate_id: "ruto"
                user: "Verified User"
                rating: 5
                text: "The candidate has clearly communicated their policy priorities."
                date: "2026-06-26"

        '400':
          description: Missing or invalid review information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_REVIEW"
                message: "rating and text are required"

        '404':
          description: No candidate exists with the given candidate ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Candidate not found"

  /candidates/{candidateId}/reviews/{reviewId}:
    put:
      summary: Replace an existing review for a candidate
      description: >
        Full replacement. rating and text are required. If user is omitted it
        resets to "Anonymous Voter". The original review date is kept.
      parameters:
        - name: candidateId
          in: path
          required: true
          description: Unique identifier of the candidate the review belongs to
          schema:
            type: string
            example: "ruto"

        - name: reviewId
          in: path
          required: true
          description: Unique identifier of the review to replace
          schema:
            type: integer
            example: 2

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            example:
              user: "Verified User"
              rating: 3
              text: "Updated view after the debate."

      responses:
        '200':
          description: Review replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id: 2
                candidate_id: "ruto"
                user: "Verified User"
                rating: 3
                text: "Updated view after the debate."
                date: "2026-06-26"

        '400':
          description: Missing or invalid review information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_REVIEW"
                message: "rating and text are required"

        '404':
          description: No candidate exists with the given candidate ID, or no review with the given review ID exists for that candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Review not found"

  /rallies:
    get:
      summary: Return civic events and rallies
      description: >
        Sample civic event feed for Group 12 (accessibility and traffic
        planning). Dates are generated relative to today in Nairobi time
        (UTC+3), so the feed always contains current and upcoming events.
        Results are ordered by date. Use upcoming=true to hide events that
        have already ended.
      parameters:
        - name: upcoming
          in: query
          required: false
          description: >
            When true, return only events that have not ended yet. When false
            or omitted, return every event in the feed.
          schema:
            type: boolean
            example: true

      responses:
        '200':
          description: A list of civic events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rally'
              example:
                - id: "rally_07"
                  title: "National Presidential Final Pitch & Mega Civic Mobilization"
                  organizer: "Consortium of Registered Political Parties & Civic Engagement Forum"
                  candidate: "Presidential Candidates Joint Civic Appearance"
                  party: "Multi-Party Civic Initiative"
                  venue: "Nyayo National Stadium"
                  location:
                    lat: -1.3039
                    lng: 36.8242
                  date: "2026-11-14"
                  startTime: "10:30"
                  endTime: "17:30"
                  expectedCrowd: "40,000+"
                  eventType: "National Mega Campaign Rally"

        '400':
          description: The upcoming parameter is not true or false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_PARAMETER"
                message: "upcoming must be true or false"

  /rallies/{rallyId}/travel:
    get:
      summary: Travel advice for getting to a civic event
      description: >
        Combines our rally data with Group 10's landmarks and rides. Returns
        the fastest and cheapest ride from the voter's starting landmark to the
        venue, a crowd-pressure level, a suggested leave-by time and, when the
        venue is likely to be busy, a walkable alternative drop-off. Everything
        is an estimate: fares and ETAs reflect current conditions, not the
        event time, and crowd pressure is a rule-based estimate from expected
        attendance and the number of ride options, not live demand.
      parameters:
        - name: rallyId
          in: path
          required: true
          description: Unique identifier of the rally
          schema:
            type: string
            example: "rally_07"

        - name: from
          in: query
          required: true
          description: Id of the landmark the voter is starting from (from GET /transport/landmarks)
          schema:
            type: string
            example: "1"

      responses:
        '200':
          description: Travel advice for the rally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelAdvice'
              example:
                rally:
                  id: "rally_07"
                  title: "National Presidential Final Pitch & Mega Civic Mobilization"
                  venue: "Nyayo National Stadium"
                  date: "2026-11-14"
                  startTime: "10:30"
                  endTime: "17:30"
                  expectedCrowd: "40,000+"
                from:
                  id: "1"
                  name: "cbd"
                rides:
                  count: 3
                  fastest:
                    id: "r1"
                    providerName: "Bolt"
                    rideType: "Bolt Boda"
                    fare: { amount: 99, currency: "KES" }
                    etaMinutes: 5
                    capacity: 1
                  cheapest:
                    id: "r1"
                    providerName: "Bolt"
                    rideType: "Bolt Boda"
                    fare: { amount: 99, currency: "KES" }
                    etaMinutes: 5
                    capacity: 1
                pressure:
                  level: "high"
                  expectedCrowdNumber: 40000
                  bufferMinutes: 60
                  reasons:
                    - "Expected attendance is 40,000+"
                leaveBy:
                  date: "2026-11-14"
                  time: "09:25"
                  basedOnEtaMinutes: 5
                  bufferMinutes: 60
                  leaveNow: false
                alternativeDropoff:
                  landmark: { id: "4", name: "uhuru park" }
                  distanceKm: 1
                  walkMinutes: 11
                  fastest:
                    id: "r1"
                    providerName: "Bolt"
                    rideType: "Bolt Boda"
                    fare: { amount: 78, currency: "KES" }
                    etaMinutes: 4
                    capacity: 1
                  cheapest:
                    id: "r1"
                    providerName: "Bolt"
                    rideType: "Bolt Boda"
                    fare: { amount: 78, currency: "KES" }
                    etaMinutes: 4
                    capacity: 1
                  savesFare: 21
                  savesMinutes: 1
                disclaimer: "Estimates only. Ride fares and ETAs reflect current conditions, not the event time. Crowd pressure is a rule-based estimate from expected attendance and the number of ride options, not live demand."

        '400':
          description: The from parameter is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_PARAMETER"
                message: "from (a landmark id) is required"

        '404':
          description: No rally or no landmark exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Rally not found"

        '409':
          description: The event has already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "EVENT_ENDED"
                message: "This event has already ended"

        '502':
          description: Group 10's landmarks or rides could not be reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Partner data unavailable"

  /polling-stations:
    get:
      summary: Return polling stations
      description: >
        Our own list of polling stations, grouped by area. This is a team
        sample, not the official IEBC register: stations with verified true
        were copied from the IEBC polling station list, all others have not
        been checked against it. Coordinates are approximate (one point per
        area), not the school gate.
      responses:
        '200':
          description: A list of polling stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PollingStation'
              example:
                - id: "ps_001"
                  name: "Westlands Primary School"
                  area: "Westlands"
                  county: "Nairobi City"
                  constituency: "Westlands"
                  ward: "Parklands/Highridge"
                  location:
                    lat: -1.2673
                    lng: 36.8118
                  locationApproximate: true
                  verified: true

  /polling-stations/{stationId}/nearest-landmark:
    get:
      summary: Nearest Group 10 landmark to a polling station
      description: >
        Group 10's rides endpoint only understands its own landmarks, so to
        compare ride prices to a polling station we find the landmark nearest
        to it and request rides for that landmark. Prices are therefore for the
        landmark area, not the exact station. Returns 422 when no landmark is
        within 15 km. Uses the same saved landmark list as
        GET /transport/landmarks if Group 10 is briefly unreachable.
      parameters:
        - name: stationId
          in: path
          required: true
          description: Unique identifier of the polling station
          schema:
            type: string
            example: "ps_001"

      responses:
        '200':
          description: The nearest landmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearestLandmark'
              example:
                station:
                  id: "ps_001"
                  name: "Westlands Primary School"
                  area: "Westlands"
                landmark:
                  id: "2"
                  name: "westlands"
                  location:
                    lat: -1.2673
                    lng: 36.811
                distanceKm: 0.1

        '404':
          description: No polling station exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "Polling station not found"

        '422':
          description: No landmark within 15 km of the polling station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NO_NEARBY_LANDMARK"
                message: "No ride landmark within 15 km of this polling station"

        '502':
          description: Group 10's landmarks could not be reached and no saved copy exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Partner data unavailable"

components:
  schemas:

    PollingStation:
      type: object
      required:
        - id
        - name
        - area
        - location
        - verified
      properties:
        id:
          type: string
          example: "ps_001"
        name:
          type: string
          example: "Westlands Primary School"
        area:
          type: string
          description: Neighbourhood the station is listed under
          example: "Westlands"
        county:
          type: string
          example: "Nairobi City"
        constituency:
          type: string
          nullable: true
          example: "Westlands"
        ward:
          type: string
          nullable: true
          example: "Parklands/Highridge"
        location:
          type: object
          description: Approximate point for the area, not the school gate
          properties:
            lat:
              type: number
              example: -1.2673
            lng:
              type: number
              example: 36.8118
        locationApproximate:
          type: boolean
          example: true
        verified:
          type: boolean
          description: true only if the name was copied from the IEBC polling station list
          example: true

    NearestLandmark:
      type: object
      properties:
        station:
          type: object
          properties:
            id:
              type: string
              example: "ps_001"
            name:
              type: string
              example: "Westlands Primary School"
            area:
              type: string
              example: "Westlands"
        landmark:
          type: object
          properties:
            id:
              type: string
              example: "2"
            name:
              type: string
              example: "westlands"
            location:
              type: object
              properties:
                lat:
                  type: number
                  example: -1.2673
                lng:
                  type: number
                  example: 36.811
        distanceKm:
          type: number
          description: Straight-line distance from the station to the landmark
          example: 0.1

    Candidate:
      type: object
      required:
        - id
        - name
        - average_rating
        - review_count
      properties:
        id:
          type: string
          example: "ruto"

        initials:
          type: string
          nullable: true
          example: "WR"

        name:
          type: string
          example: "Dr. William Ruto"

        party:
          type: string
          nullable: true
          example: "Kenya Kwanza Alliance / UDA"

        description:
          type: string
          nullable: true
          example: "Current President of Kenya with experience in national government."

        experience:
          type: string
          nullable: true
          example: "Current President of Kenya (2022-2026), former Deputy President (2013-2022)."

        vision:
          type: string
          nullable: true
          example: "The Bottom-Up Economic Transformation Agenda (BETA)."

        fiscal:
          type: string
          nullable: true
          example: "Expanding the formal tax base to manage public debt."

        agriculture:
          type: string
          nullable: true
          example: "Subsidized farm inputs and fertilizer distribution."

        governance:
          type: string
          nullable: true
          example: "Protecting and increasing funding to the 47 counties."

        cost_of_living:
          type: string
          nullable: true
          example: "Cutting consumer levies and production taxes."

        average_rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          nullable: true
          example: 4.0

        review_count:
          type: integer
          minimum: 0
          example: 1

      example:
        id: "ruto"
        initials: "WR"
        name: "Dr. William Ruto"
        party: "Kenya Kwanza Alliance / UDA"
        description: "Current President of Kenya with experience in national government."
        experience: "Current President of Kenya (2022-2026), former Deputy President (2013-2022)."
        vision: "The Bottom-Up Economic Transformation Agenda (BETA)."
        fiscal: "Expanding the formal tax base to manage public debt."
        agriculture: "Subsidized farm inputs and fertilizer distribution."
        governance: "Protecting and increasing funding to the 47 counties."
        cost_of_living: "Cutting consumer levies and production taxes."
        average_rating: 4.0
        review_count: 1

    Review:
      type: object
      required:
        - id
        - candidate_id
        - user
        - rating
        - text
        - date
      properties:
        id:
          type: integer
          format: int64
          example: 1

        candidate_id:
          type: string
          example: "ruto"

        user:
          type: string
          example: "Anonymous Voter"

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

        text:
          type: string
          example: "Clear focus on devolution structural systems, but need more clarity on agricultural subsidy time-tables."

        date:
          type: string
          format: date
          example: "2026-06-25"

      example:
        id: 1
        candidate_id: "ruto"
        user: "Anonymous Voter"
        rating: 4
        text: "Clear focus on devolution structural systems, but need more clarity on agricultural subsidy time-tables."
        date: "2026-06-25"

    CreateReviewRequest:
      type: object
      required:
        - rating
        - text
      properties:
        user:
          type: string
          description: Name of the reviewer. Defaults to Anonymous Voter if omitted.
          default: "Anonymous Voter"
          example: "Verified User"

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        text:
          type: string
          example: "The candidate has clearly communicated their policy priorities."

      example:
        user: "Verified User"
        rating: 5
        text: "The candidate has clearly communicated their policy priorities."

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "NOT_FOUND"

        message:
          type: string
          example: "Candidate not found"

      example:
        code: "NOT_FOUND"
        message: "Candidate not found"

    Rally:
      type: object
      required:
        - id
        - title
        - venue
        - location
        - date
        - startTime
        - endTime
        - expectedCrowd
      properties:
        id:
          type: string
          example: "rally_07"

        title:
          type: string
          example: "National Presidential Final Pitch & Mega Civic Mobilization"

        organizer:
          type: string
          example: "Consortium of Registered Political Parties & Civic Engagement Forum"

        candidate:
          type: string
          example: "Presidential Candidates Joint Civic Appearance"

        party:
          type: string
          example: "Multi-Party Civic Initiative"

        venue:
          type: string
          example: "Nyayo National Stadium"

        location:
          type: object
          description: Venue coordinates
          properties:
            lat:
              type: number
              format: float
              example: -1.3039
            lng:
              type: number
              format: float
              example: 36.8242

        date:
          type: string
          format: date
          description: Event date in Nairobi time (YYYY-MM-DD)
          example: "2026-11-14"

        startTime:
          type: string
          description: Start time in Nairobi time (HH:MM, 24-hour)
          example: "10:30"

        endTime:
          type: string
          description: End time in Nairobi time (HH:MM, 24-hour)
          example: "17:30"

        expectedCrowd:
          type: string
          description: Approximate expected attendance, as text (for example "1,500" or "40,000+")
          example: "40,000+"

        eventType:
          type: string
          example: "National Mega Campaign Rally"

    Ride:
      type: object
      properties:
        id:
          type: string
          example: "r1"
        providerName:
          type: string
          example: "Bolt"
        rideType:
          type: string
          example: "Bolt Boda"
        fare:
          type: object
          properties:
            amount:
              type: number
              example: 99
            currency:
              type: string
              example: "KES"
        etaMinutes:
          type: integer
          example: 5
        capacity:
          type: integer
          example: 1

    TravelAdvice:
      type: object
      properties:
        rally:
          type: object
          properties:
            id: { type: string, example: "rally_07" }
            title: { type: string, example: "National Presidential Final Pitch & Mega Civic Mobilization" }
            venue: { type: string, example: "Nyayo National Stadium" }
            date: { type: string, format: date, example: "2026-11-14" }
            startTime: { type: string, example: "10:30" }
            endTime: { type: string, example: "17:30" }
            expectedCrowd: { type: string, example: "40,000+" }
        from:
          type: object
          properties:
            id: { type: string, example: "1" }
            name: { type: string, example: "cbd" }
        rides:
          type: object
          description: Usable ride options (rides with capacity 0, such as parcel delivery, are ignored)
          properties:
            count: { type: integer, example: 3 }
            fastest:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Ride'
            cheapest:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Ride'
        pressure:
          type: object
          description: >
            Rule-based estimate. Expected attendance sets the base level
            (under 1,500 low, 1,500 to 4,999 medium, 5,000 and over high). It
            goes up one level if rides look scarce (fewer than 3 options, none,
            or the fastest more than 10 minutes away).
          properties:
            level: { type: string, enum: [low, medium, high], example: "high" }
            expectedCrowdNumber: { type: integer, example: 40000 }
            bufferMinutes:
              type: integer
              description: Minutes to arrive early (15 low, 30 medium, 60 high)
              example: 60
            reasons:
              type: array
              items: { type: string }
        leaveBy:
          type: object
          description: Event start minus the fastest ride's ETA minus the buffer, in Nairobi time
          properties:
            date: { type: string, format: date, example: "2026-11-14" }
            time: { type: string, example: "09:25" }
            basedOnEtaMinutes: { type: integer, example: 5 }
            bufferMinutes: { type: integer, example: 60 }
            leaveNow: { type: boolean, example: false }
        alternativeDropoff:
          type: object
          nullable: true
          description: >
            Only present when pressure is medium or high and a landmark between
            0.4 km and 2 km from the venue is at least 15% cheaper or 3 minutes
            quicker to reach. Otherwise null.
          properties:
            landmark:
              type: object
              properties:
                id: { type: string, example: "4" }
                name: { type: string, example: "uhuru park" }
            distanceKm: { type: number, example: 1 }
            walkMinutes: { type: integer, example: 11 }
            fastest:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Ride'
            cheapest:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Ride'
            savesFare: { type: number, example: 21 }
            savesMinutes: { type: integer, example: 1 }
        disclaimer:
          type: string